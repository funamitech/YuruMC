<!DOCTYPE html>
<html lang="ko">

<head>
    <!-- @include partials/head.html font="PretendardVariable" title="{{code}} {{title}} | YuruMC" description="2021년부터 대한민국 경기도에서 운영 중인 세미 바닐라 SMP 마인크래프트 서버. 에러 페이지를 찾으셨군요. 유이한테 들켰어요." image="{{ogimage}}" path="{{path}}" -->
    <meta name="robots" content="noindex">
</head>

<body>
    <!-- @include partials/ko/nav.html langhref="?lang=en" -->

    <main class="relative flex grow items-center justify-center overflow-hidden px-4 py-16 sm:px-6">
        <div class="glow top-10 left-1/2 size-[26rem] -translate-x-1/2 {{glow}}" aria-hidden="true"></div>

        <div class="card relative w-full max-w-lg p-8 text-center sm:p-10">
            <p class="font-mono text-6xl font-bold tracking-tight {{tint}}">{{code}}</p>
            <h1 class="mt-2 text-2xl font-bold text-ink">{{title}}</h1>
            <img src="{{image}}" alt="{{imagealt}}"
                 class="mx-auto mt-6 max-h-64 w-auto rounded-2xl border border-line">
            <p class="mt-6 text-sm/relaxed">{{message}}</p>
            <p class="mt-3 text-xs text-faint">{{kicker}}</p>
            <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
                <a href="/ko/" class="{{homeclass}}">
                    <svg class="size-4" aria-hidden="true"><use href="#i-house"/></svg>
                    {{homelabel}}
                </a>
                <a href="{{alturl}}" class="{{altclass}}">
                    <svg class="size-4" aria-hidden="true"><use href="#i-{{alticon}}"/></svg>
                    {{altlabel}}
                </a>
            </div>
        </div>
    </main>

    <!-- @include partials/ko/footer.html -->
</body>

</html>
